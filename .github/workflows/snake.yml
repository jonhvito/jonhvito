name: Atualizar Snake

on:
  schedule:
    # Todos os dias às 09:17 UTC (06:17 em João Pessoa).
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Gerar SVGs para os temas claro e escuro
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: jonhvito
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Tema claro: cobra com maior contraste sobre o fundo branco.
          # Tema escuro: ciano da identidade visual.
          outputs: |
            dist/github-snake.svg?color_snake=#167D96&color_dots=#ebedf0,#c9edf4,#91d9e8,#58c4dc,#167d96
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#58C4DC&color_dots=#161b22,#163b46,#226071,#3693aa,#58c4dc

      - name: Publicar SVGs na branch output
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          jekyll: false
          commit_message: "Atualiza animação de contribuições"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
